title: PowerShell Spawning CMD with Hidden Window
id: d93f0737-a451-46fd-a91c-bed3ded6a1fa
status: experimental
description: Detects cmd.exe spawned by PowerShell with hidden window and no profile, indicates possible reverse shell activity
references:
  - https://attack.mitre.org/techniques/T1059/003
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\powershell_ise.exe'
    Image|endswith: '\cmd.exe'
  condition: selection
falsepositives:
  - Legitimate admin scripts running in the background
level: high